name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -c requirements.lock -e '.[dev]' -e ./cli
      - name: Install completion test shells
        run: sudo apt-get update -qq && sudo apt-get install -y fish zsh
      - name: Validate API, CLI and contract parity
        run: python scripts/check.py
      - name: Build both distributions
        run: python -m build && python -m build cli --outdir dist
      - name: Prepare compose env
        if: matrix.python == '3.12'
        run: cp .env.example .env
      - name: Validate Docker build
        if: matrix.python == '3.12'
        run: |
          docker compose config --quiet
          docker build --tag telegram-proxy-api:ci .
